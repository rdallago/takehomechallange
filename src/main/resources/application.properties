spring.application.name=take-home-challange

# Conexión a Base de Datos PostgreSQL (para ejecutar desde VS Code)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5433/takehome_db}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false
# Configuración de Flyway (Migraciones automáticas)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Ruta UI de Swagger
springdoc.swagger-ui.path=/swagger-ui.html

#springdoc.packages-to-scan=com.challange.takehomechallange.infrastructure.adapter.in.controller


# --- JWT ---
# El secret tiene que tener al menos 32 caracteres (HS256). El valor por defecto es solo para local
app.security.jwt.secret=${JWT_SECRET:dev-only-secret-cambiar-en-produccion-0123456789}
app.security.jwt.expiration-minutes=60

# Evita que Spring genere el usuario "user" con clave aleatoria en el log
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration