spring.application.name=take-home-challange

# Conexión a Base de Datos PostgreSQL (para ejecutar desde VS Code)
spring.datasource.url=jdbc:postgresql://localhost:5433/takehome_db
spring.datasource.username=postgres
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Configuración de Flyway (Migraciones automáticas)
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Ruta UI de Swagger
springdoc.swagger-ui.path=/swagger-ui.html

springdoc.packages-to-scan=com.challange.takehomechallange.infrastructure.adapter.in.controller